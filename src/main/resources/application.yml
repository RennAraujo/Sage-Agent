spring:
  application:
    name: sage-agent
  threads:
    virtual:
      enabled: true
  ai:
    model:
      # Liga o ChatModel do Bedrock Converse (Spring AI). Com "none" o Sage sobe sem modelo e /api/perguntas dá 503.
      chat: ${SAGE_CHAT_MODEL:bedrock-converse}
    bedrock:
      aws:
        # Credenciais vêm da cadeia padrão da AWS (variáveis de ambiente, perfil, role da instância).
        region: ${AWS_REGION:us-east-1}
  # Limites e limiar de memória do multipart não ficam aqui: o UploadConfig os deriva de sage.upload.max-zip-bytes.

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8080

# Formato texto simples. Não colocar conteúdo de documento, prompt ou resposta em MDC.
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

sage:
  crypto:
    # local: chave mestra em arquivo (desenvolvimento). kms: AWS KMS (produção), região e credenciais do ambiente AWS.
    provider: local
    local-key-file: secrets/local-master.key
    kms-key-id: ${SAGE_KMS_KEY_ID:}
  storage:
    # local: blobs cifrados em arquivos sob local-dir. s3: bucket em s3-bucket (região e credenciais do ambiente AWS).
    type: local
    local-dir: data
    s3-bucket: ${SAGE_S3_BUCKET:}
  auth:
    # Chaves de API: lista de { name, role (READER|EDITOR), sha256 }. Só o hash fica aqui; gere com scripts/new-api-key.
    # Exemplo via ambiente: SAGE_AUTH_KEYS_0_NAME=ana SAGE_AUTH_KEYS_0_ROLE=EDITOR SAGE_AUTH_KEYS_0_SHA256=<hash>
    # Sem nenhuma chave configurada, todos os endpoints de /api respondem 401.
    keys: []
  rate-limit:
    # Por chave de API, janela de 1 minuto.
    questions-per-minute: 20
    uploads-per-minute: 10
  upload:
    # Arquivo comum e também o Markdown já convertido (um PDF pequeno pode virar texto grande).
    max-file-bytes: 10MB
    # Zip: tamanho do arquivo, número de entradas e total descompactado (contado na leitura, contra zip bomb).
    max-zip-bytes: 50MB
    max-zip-entries: 500
    max-zip-uncompressed-bytes: 200MB
  retrieval:
    # Teto de caracteres por trecho do índice (bloco de código único pode passar) e candidatos pedidos à busca (20: o custo do reranker é linear no número de pares).
    max-chunk-chars: 1500
    candidates: 20
    # Quantos trechos, depois do reranker, vão para o contexto do modelo de linguagem.
    context-chunks: 5
    # Teto de trechos somados numa comparação com busca por versão (dividido entre as versões, e a interna se houver).
    # Mínimo 4: cada grupo buscado tem ao menos 2 trechos, então cabem teto/2 grupos.
    comparison-max-chunks: 8
    # Limiar de relevância sem o reranker (o score vira cobertura lexical, que perde para pergunta pt sobre doc en).
    # 0.0 = qualquer candidato passa. Consumido pelo roteamento da pergunta.
    min-score-without-reranker: 0.0
    # Score mínimo do melhor trecho (nota do reranker) para a pergunta ir ao modelo. Abaixo disso, resposta fixa
    # "Não encontrei isso na documentação disponível." sem gastar token. Calibrado na Task 20.
    min-score: 0.35
  models:
    # Model ids (ou inference profiles) do Bedrock. Sem padrão: sem eles /api/perguntas responde 503.
    fast-id: ${SAGE_MODEL_FAST_ID:}
    strong-id: ${SAGE_MODEL_STRONG_ID:}
    max-tokens: 1500
    temperature: 0
    # Prazo total de uma resposta do modelo (do pedido ao último token, não por token).
    timeout: 50s
  questions:
    # Orçamento de análise, busca e auditoria antes do modelo. O SSE fica aberto por isto mais sage.models.timeout.
    preparation-timeout: 20s
    index-retry-after: 5s
  cache:
    # Respostas completas em memória (nunca em disco), só para a primeira pergunta de uma conversa. Qualquer documento
    # salvo ou apagado esvazia o cache inteiro.
    ttl: 6h
    max-entries: 1000
  conversation:
    # Últimas análises por conversa (para "e no 17?" herdar linguagem e versão); em memória, por instância.
    ttl: 30m
    max-turns: 5
    max-conversations: 10000
  flow:
    # Perguntas de fluxo ("como funciona o fluxo de X"): documento interno até este tamanho entra inteiro; maior que isso,
    # entra a seção de nível 2 do melhor trecho.
    max-doc-chars: 12000
    # Documentos apontados por [[wiki-link]] (profundidade 1, só da mesma aplicação) que entram no contexto.
    max-linked-docs: 3
    # Teto do texto somado de todo o contexto do modelo nesse caso. O que não cabe é cortado entre trechos.
    max-context-chars: 24000
  gaps:
    # Perguntas que a documentação interna não respondeu, cifradas, uma por ocorrência. Passou do teto, as mais antigas
    # são apagadas na gravação.
    max-entries: 5000
  web:
    # Fallback web: só páginas de fontes oficiais. Chave: linguagem (id de aliases-publicos.yml); valor: domínios aceitos
    # (o domínio e seus subdomínios, sempre por https). Linguagem fora da lista não tem fallback.
    allowlist:
      java: [docs.oracle.com, openjdk.org]
      spring-boot: [docs.spring.io]
      spring-framework: [docs.spring.io]
      spring-security: [docs.spring.io]
    max-pages-per-question: 3
    fetch-timeout: 5s
    max-page-bytes: 2MB
    max-redirects: 3
    # Prazo do fallback inteiro (busca e até 3 páginas). Precisa ser menor que sage.questions.preparation-timeout.
    fallback-timeout: 8s
    # Sem chave, o fallback fica desligado (aviso na subida). Chave do plano gratuito do Brave Search: https://brave.com/search/api/
    brave-api-key: ${SAGE_BRAVE_API_KEY:}
